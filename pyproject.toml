[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-monitor"
version = "0.1.0"
description = "LAN-only real-time stock monitor for Termux"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116,<0.128",
  "httpx>=0.28,<1",
  "pydantic==1.10.26",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
stock-monitor = "stock_monitor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
