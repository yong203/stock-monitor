<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>{% block title %}Stock Monitor{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}?v=0.3.0">
    <script src="{{ url_for('static', path='app.js') }}?v=0.3.0" defer></script>
  </head>
  <body data-page="{{ page }}">
    <header class="site-header">
      <a class="brand" href="/" aria-label="Stock Monitor 홈">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span>Stock Monitor</span>
      </a>
      <nav aria-label="주요 메뉴">
        {% if page == "watchlist" %}
          <a class="button secondary" href="/">대시보드</a>
        {% else %}
          <a class="button secondary" href="/watchlist">관심종목 관리</a>
        {% endif %}
      </nav>
    </header>
    <main class="layout">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
